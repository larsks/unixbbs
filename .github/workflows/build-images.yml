name: Build and publish images

# Conventional Commits (https://www.conventionalcommits.org/) drive the
# version bump, via semantic-release (see .releaserc.json): `fix:` ->
# patch, `feat:` -> minor, a `BREAKING CHANGE:` footer (or `!` after the
# type) -> major. Commits that don't match any of those (docs:, chore:,
# refactor:, ...) don't bump the version, and if a push to main contains
# none of the former, no release is created and the build job is
# skipped -- "latest" only moves when a real change lands.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      major: ${{ steps.semrel.outputs.new_release_major_version }}
      minor: ${{ steps.semrel.outputs.new_release_minor_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds and pushes the shared runtime base (container/base/Containerfile,
  # see build.yaml's header comment for why it's shared) before the matrix
  # below, so the other images can build FROM it. Referenced by the
  # `build` job via its immutable digest, not a mutable tag -- a tag
  # (even "latest") could be repointed between this job finishing and the
  # matrix job's FROM resolving it, silently mixing a stale/different base
  # into one image. `push: true` here (rather than `--load` into the
  # runner's local docker daemon) is what makes that digest fetchable by
  # `docker-image://` from the separate `build` job below: the two jobs
  # don't share a docker daemon, only whatever's on ghcr.io.
  build-base:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: container/base/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/larsks/unixbbs-base:latest
            ghcr.io/larsks/unixbbs-base:${{ needs.version.outputs.version }}
            ghcr.io/larsks/unixbbs-base:${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            ghcr.io/larsks/unixbbs-base:${{ needs.version.outputs.major }}

  build:
    needs: [version, build-base]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - name: user-service
            context: .
            file: container/user-service/Containerfile
            build-contexts: base=docker-image://ghcr.io/larsks/unixbbs-base@${{ needs['build-base'].outputs.digest }}
          - name: mail-service
            context: ./container/mail
            file: container/mail/Containerfile
            build-contexts: base=docker-image://ghcr.io/larsks/unixbbs-base@${{ needs['build-base'].outputs.digest }}
          - name: chat-service
            context: .
            file: container/chat-service/Containerfile
            build-contexts: base=docker-image://ghcr.io/larsks/unixbbs-base@${{ needs['build-base'].outputs.digest }}
          - name: cron-service
            context: ./container/cron
            file: container/cron/Containerfile
            build-contexts: base=docker-image://ghcr.io/larsks/unixbbs-base@${{ needs['build-base'].outputs.digest }}
          - name: user
            context: ./container/user
            file: container/user/Containerfile
            # Deliberately doesn't share `base` -- see build.yaml's header
            # comment -- so no build-contexts entry here.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-contexts: ${{ matrix['build-contexts'] }}
          tags: |
            ghcr.io/larsks/unixbbs-${{ matrix.name }}:latest
            ghcr.io/larsks/unixbbs-${{ matrix.name }}:${{ needs.version.outputs.version }}
            ghcr.io/larsks/unixbbs-${{ matrix.name }}:${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            ghcr.io/larsks/unixbbs-${{ matrix.name }}:${{ needs.version.outputs.major }}
