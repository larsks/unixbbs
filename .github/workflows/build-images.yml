name: Build and publish images

# Conventional Commits (https://www.conventionalcommits.org/) drive the
# version bump, via semantic-release (see .releaserc.json): `fix:` ->
# patch, `feat:` -> minor, a `BREAKING CHANGE:` footer (or `!` after the
# type) -> major. Commits that don't match any of those (docs:, chore:,
# refactor:, ...) don't bump the version, and if a push to main contains
# none of the former, no release is created and the build job is
# skipped -- "latest" only moves when a real change lands.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      major: ${{ steps.semrel.outputs.new_release_major_version }}
      minor: ${{ steps.semrel.outputs.new_release_minor_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build all services from the same Compose build definition used locally.
  # Buildx Bake reads build.yaml directly; the platform override stays here
  # so local Compose builds continue to target the local architecture.
  build:
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-compose-action@v2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          TAG: ${{ needs.version.outputs.version }}
        run: |
          docker buildx bake \
            -f build.yaml \
            --set '*.platform=linux/amd64,linux/arm64' \
            --set 'base.output=type=cacheonly' \
            --push

      - name: Publish release tag aliases
        env:
          TAG: ${{ needs.version.outputs.version }}
          RELEASE_MAJOR: ${{ needs.version.outputs.major }}
          RELEASE_MINOR: ${{ needs.version.outputs.minor }}
        run: |
          docker compose -f build.yaml config --images | while IFS= read -r source; do
            case "${source}" in
              ghcr.io/larsks/unixbbs-*:${TAG})
                image="${source%:${TAG}}"
                docker buildx imagetools create \
                  --tag "${image}:latest" \
                  --tag "${image}:${RELEASE_MAJOR}.${RELEASE_MINOR}" \
                  --tag "${image}:${RELEASE_MAJOR}" \
                  "${source}"
                ;;
            esac
          done
