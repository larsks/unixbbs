# Manages the two persistent core services (see DESIGN.md §1/§7). The
# ephemeral, per-connection user container is deliberately NOT part of
# this stack -- it's spawned per-connection by the external AX.25
# ingress process (out of scope here, see DESIGN.md's goals/non-goals),
# using `docker run` against the same three named volumes declared
# below.
#
# The volumes are given explicit `name:` values rather than left to
# Compose's default `<project>_<name>` prefixing specifically so that
# external `docker run` invocations (spawning ephemeral containers) can
# reference them by a name that doesn't depend on which directory this
# stack happens to be brought up from.
#
# Each service declares only `image:` here, not `build:`. Build
# configuration -- including the shared `base` image these services are
# built from (container/base/Containerfile) -- lives in build.yaml
# instead, deliberately kept out of this file: build.yaml's `base`
# service is wired into the others via `additional_contexts`, and if
# that wiring were declared here, plain `docker compose up`/`pull`
# would fail outright (Compose validates `additional_contexts:
# service:base` even for commands that never touch `base`) unless
# `base` were also brought up as a real, useless running container.
#   - `docker compose up`                    uses/pulls the `image:`
#                                             (fast, no local build;
#                                             what a Pi should do)
#   - `docker compose -f build.yaml build`   builds from source and
#                                             tags the result with that
#                                             same `image:` name
# `TAG` selects which published version to pull (see .env.example);
# it defaults to `latest`.
services:
  api-service:
    image: ghcr.io/larsks/unixbbs-api-service:${TAG:-latest}
    environment:
      BBS_DATA_DIR: ${BBS_DATA_DIR:-/bbs-data}
    command:
      - -db=/bbs-data/bbs.db
      - -data-dir=${BBS_DATA_DIR:-bbs-data}
      - -write-socket=/bbs-sock/api-write.sock
      - -read-socket=/bbs-sock/api-read.sock
      - -weather-url=${WEATHER_URL:-https://api.weather.gov/gridpoints/BOX/71,101/forecast}
      - -weather-user-agent=${WEATHER_USER_AGENT:-unixbbs-api-service}
      - -weather-cache-ttl=${WEATHER_CACHE_TTL:-1800}
    volumes:
      - bbs-data:${BBS_DATA_DIR:-/bbs-data}
      - bbs-sock:/bbs-sock
    restart: unless-stopped

  mail-service:
    image: ghcr.io/larsks/unixbbs-mail-service:${TAG:-latest}
    # The whole bbs-data volume is mounted read-write here, even though
    # mail-service only ever needs to write mail/ and only ever reads
    # bbs.db. A per-subpath read-only mount for bbs.db was tried and
    # rejected: Docker's volume-subpath mounts don't auto-create their
    # target (confirmed by testing), so mounting a read-only subpath at
    # /bbs-data/bbs.db would race api-service's own lazy creation of
    # that file on first-ever startup -- whichever container wins the
    # race, the other fails outright rather than degrading gracefully.
    # "bbs.db is read-only from mail-service's side" (DESIGN.md §4/§6)
    # is therefore a software invariant (its Postfix config only ever
    # issues SELECT queries) rather than a mount-level guarantee.
    volumes:
      - bbs-data:/bbs-data
      - bbs-mailsock:/var/spool/postfix/public/bbssock
    depends_on:
      - api-service
    restart: unless-stopped

  chat-service:
    image: ghcr.io/larsks/unixbbs-chat-service:${TAG:-latest}
    command:
      - -db=/bbs-data/bbs.db
      - -socket=/bbs-sock/chat.sock
    # bbs-data is mounted read-only in full: unlike mail-service (which
    # needs to write mail/), chat-service only ever issues SELECT
    # queries against bbs.db (DESIGN.md §9.1/§9.4), and the whole-volume
    # mount avoids the subpath auto-vivification race documented on
    # mail-service below (this isn't a subpath mount, so it doesn't hit
    # that problem, but there's also no reason to risk it).
    volumes:
      - bbs-data:/bbs-data:ro
      - bbs-chatsock:/bbs-sock
    depends_on:
      - api-service
    restart: unless-stopped

  cron-service:
    image: ghcr.io/larsks/unixbbs-cron-service:${TAG:-latest}
    volumes:
      - bbs-data:/bbs-data
      - bbs-mailsock:/var/spool/postfix/public/bbssock
    restart: unless-stopped

volumes:
  bbs-data:
    name: unixbbs-data
  bbs-sock:
    name: unixbbs-sock
  bbs-mailsock:
    name: unixbbs-mailsock
  bbs-chatsock:
    name: unixbbs-chatsock
